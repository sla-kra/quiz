  flex-direction: column;

/* ── Top bar ── */
.top-bar {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 14px 24px;
  background: rgba(0, 0, 0, 0.25);
}

#questionCounter {
  font-size: 15px;
  font-weight: bold;
  white-space: nowrap;
  min-width: 100px;
}

.logo {
  font-size: 15px;
  font-weight: bold;
  white-space: nowrap;
  opacity: 0.8;
}

.progress-bar {
  flex: 1;
  height: 10px;
  background: rgba(255, 255, 255, 0.25);
  border-radius: 999px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  width: 0;
  background: white;
  transition: width 0.4s ease;
}

/* ── Question card ── */
.question-wrap {
  display: flex;
  justify-content: center;
  padding: 28px 20px 20px;
}

.question-card {
  background: #f0eaff;
  color: #1a0a3d;
  border-radius: 16px;
  padding: 28px 40px;
  max-width: 780px;
  width: 100%;
  text-align: center;
  font-size: 30px;
  font-weight: bold;
  min-height: 110px;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1.3;
  /* Top highlight + deep drop shadow = 3D look */
  box-shadow:
    0 -3px 0 rgba(255, 255, 255, 0.6) inset,
    0  4px 0 #7c3abf,
    0  8px 0 #4f1f85,
    0 14px 30px rgba(0, 0, 0, 0.5),
    0  2px 8px  rgba(0, 0, 0, 0.25);
  border-top: 1.5px solid rgba(255, 255, 255, 0.85);
}

/* ── Quiz image ── */
.quiz-image-wrap {
  display: flex;
  justify-content: center;
  padding: 0 20px 14px;
}

.quiz-image {
  width: 100%;
  max-width: 780px;
  height: 400px;
  object-fit: cover;
  object-position: center 20%;
  border-radius: 14px;
  box-shadow:
    0 -2px 0 rgba(255, 255, 255, 0.12) inset,
    0  5px 0 #340d6b,
    0 10px 28px rgba(0, 0, 0, 0.5);
  display: block;
}

/* ── Answer grid ── */
.answers-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  padding: 0 20px 20px;
  max-width: 820px;
  margin: 0 auto;
  width: 100%;
}

.answer-btn {
  border: none;
  border-radius: 12px;
  padding: 20px 18px;
  font-size: 20px;
  font-weight: bold;
  color: white;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 14px;
  transition: transform 0.1s ease, box-shadow 0.1s ease, filter 0.15s ease;
  min-height: 84px;
  text-align: left;
  /* Top highlight + coloured bottom edge + drop shadow = 3D */
  box-shadow:
    0 -2px 0 rgba(255, 255, 255, 0.22) inset,
    0  5px 0 var(--btn-shadow),
    0 10px 24px rgba(0, 0, 0, 0.45);
  border-top: 1.5px solid rgba(255, 255, 255, 0.2);
  position: relative;
  top: 0;
}

.answer-btn:hover:not(:disabled) {
  filter: brightness(1.1);
  transform: translateY(-2px);
  box-shadow:
    0 -2px 0 rgba(255, 255, 255, 0.22) inset,
    0  7px 0 var(--btn-shadow),
    0 14px 28px rgba(0, 0, 0, 0.5);
}

.answer-btn:disabled {
  cursor: default;
}

.answer-btn .shape {
  font-size: 22px;
  flex-shrink: 0;
  line-height: 1;
}

.answer-btn.a { background: #e21b3c; --btn-shadow: #8b0f22; }
.answer-btn.b { background: #1368ce; --btn-shadow: #0a3e7e; }
.answer-btn.c { background: #d89e00; --btn-shadow: #7a5900; }
.answer-btn.d { background: #26890c; --btn-shadow: #145005; }

/* Zaznaczony (przed zatwierdzeniem) */
.answer-btn.selected {
  outline: 4px solid white;
  filter: brightness(1.18);
  transform: translateY(-3px);
  box-shadow:
    0 -2px 0 rgba(255, 255, 255, 0.22) inset,
    0  8px 0 var(--btn-shadow),
    0 16px 30px rgba(0, 0, 0, 0.55);
}

/* Feedback states */
.answer-btn.correct {
  outline: 4px solid white;
  filter: brightness(1.15);
  animation: pop 0.35s ease;
}

.answer-btn.reveal-correct {
  outline: 4px solid white;
  filter: brightness(1.15);
}

.answer-btn.incorrect {
  filter: brightness(0.38);
}

@keyframes pop {
  0%   { transform: scale(1); }
  50%  { transform: scale(1.06); }
  100% { transform: scale(1); }
}

/* ── Next button ── */
.bottom-bar {
  text-align: center;
  padding: 4px 20px 28px;
}

.bottom-bar button {
  background: white;
  color: #46178f;
  border: none;
  border-radius: 12px;
  padding: 14px 40px;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
  transition: transform 0.1s ease, box-shadow 0.15s ease;
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
}

.bottom-bar button:hover {
  transform: scale(1.04);
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
}

.result-screen .trophy {
  font-size: 88px;
  margin-bottom: 16px;
  animation: pop 0.5s ease;
}

.result-screen h2 {
  font-size: 42px;
  font-weight: bold;
  margin-bottom: 8px;
}

.result-screen .score-big {
  font-size: 72px;
  font-weight: bold;
  margin: 12px 0;
  line-height: 1;
}

.result-screen p {
  font-size: 20px;
  opacity: 0.85;
  margin-bottom: 6px;
}

.status-badge {
  display: inline-block;
  margin-top: 20px;
  padding: 10px 32px;
  border-radius: 999px;
  font-size: 22px;
  font-weight: bold;
  letter-spacing: 1px;
}

.status-badge.passed { background: #26890c; }
.status-badge.failed { background: #e21b3c; }

/* ── Restore toast ── */
.restore-info {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0, 0, 0, 0.65);
  color: white;
  padding: 10px 22px;
  border-radius: 10px;
  font-size: 14px;
  white-space: nowrap;
  backdrop-filter: blur(4px);
}

.hidden {
  display: none !important;
}

/* ════════════════════════════════════
   MARIO SUCCESS  (score = 100%)
════════════════════════════════════ */
.result-screen.mario-success {
  background-color: #1b1b8e;
  overflow: hidden;
}

.level-clear-text {
  font-family: 'Courier New', monospace;
  font-weight: 900;
  font-size: 30px;
  color: #FFD700;
  letter-spacing: 4px;
  text-shadow: 3px 3px 0 #8B4513;
  animation: level-bounce 0.45s ease-in-out infinite alternate;
  margin-bottom: 4px;
  z-index: 1;
}

@keyframes level-bounce {
  from { transform: translateY(0) scale(1); }
  to   { transform: translateY(-12px) scale(1.07); }
}

.mario-hero {
  font-size: 80px;
  display: block;
  animation: mario-jump-anim 0.42s ease-in-out infinite alternate;
  z-index: 1;
  margin: 4px 0;
}

@keyframes mario-jump-anim {
  from { transform: translateY(0); }
  to   { transform: translateY(-22px); }
}

.score-big.golden {
  color: #FFD700;
  text-shadow: 3px 3px 0 #8B4513;
  font-family: 'Courier New', monospace;
  z-index: 1;
}

/* Coin flying up */
.coin-particle {
  position: absolute;
  font-size: 28px;
  pointer-events: none;
  animation: coin-fly linear forwards;
}

@keyframes coin-fly {
  0%   { transform: translateY(0)      rotate(0deg);   opacity: 1; }
  65%  { opacity: 1; }
  100% { transform: translateY(-480px) rotate(540deg); opacity: 0; }
}

/* Firework dots */
.firework-dot {
  position: absolute;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  pointer-events: none;
  transition: transform 0.75s ease-out, opacity 0.75s ease-out;
}

/* ════════════════════════════════════
   MARIO FAILURE  (score ≤ 20%)
════════════════════════════════════ */
.result-screen.mario-failure {
  background-color: #000;
  animation: screen-to-black 0.7s ease forwards;
}

@keyframes screen-to-black {
  from { background-color: #46178f; }
  to   { background-color: #000; }
}

.mario-death-char {
  font-size: 72px;
  display: block;
  animation: mario-die 2.6s ease forwards;
}

@keyframes mario-die {
  0%   { transform: translateY(0)     rotate(0deg);   opacity: 1; }
  22%  { transform: translateY(-90px) rotate(0deg);   opacity: 1; }
  100% { transform: translateY(520px) rotate(180deg); opacity: 0.05; }
}

.game-over-text {
  font-family: 'Courier New', monospace;
  font-weight: 900;
  font-size: 56px;
  color: #ff1a1a;
  letter-spacing: 5px;
  text-shadow: 4px 4px 0 #800000;
  animation: game-over-appear 0.6s cubic-bezier(0.34,1.56,0.64,1) 1.9s both;
}

@keyframes game-over-appear {
  from { opacity: 0; transform: scale(0.2); }
  to   { opacity: 1; transform: scale(1); }
}

.game-over-sub {
  animation: game-over-appear 0.6s ease 2.4s both;
  display: flex;
  flex-direction: column;
  align-items: center;
}

  api: null,

  findAPI(win) {
    let tries = 0;
    while ((win.API == null) && (win.parent != null) && (win.parent != win)) {
      tries++;
      if (tries > 20) break;
      win = win.parent;
    }
    return win.API;
  },

  getAPI() {
    if (this.api) return this.api;
    this.api = this.findAPI(window);

    if (!this.api && window.opener) {
      this.api = this.findAPI(window.opener);
    }

    return this.api;
  },

  init() {
    const api = this.getAPI();
    if (!api) {
      console.warn("SCORM API not found. Running in standalone mode.");
      return false;
    }

    const result = api.LMSInitialize("");
    this.initialized = (result === "true");
    return this.initialized;
  },

  finish() {
    if (!this.initialized) return false;
    const result = this.api.LMSFinish("");
    return result === "true";
  },

  getValue(element) {
    if (!this.initialized) return "";
    return this.api.LMSGetValue(element);
  },

  setValue(element, value) {
    if (!this.initialized) return false;
    const result = this.api.LMSSetValue(element, value);
    return result === "true";
  },

  save() {
    if (!this.initialized) return false;
    const result = this.api.LMSCommit("");
    return result === "true";
  },

  getLastError() {
    if (!this.api) return "0";
    return this.api.LMSGetLastError();
  },

  getErrorString(errorCode) {
    if (!this.api) return "";
    return this.api.LMSGetErrorString(errorCode);
  },

  getDiagnostic(errorCode) {
    if (!this.api) return "";
    return this.api.LMSGetDiagnostic(errorCode);
  }
};

</script>
  <script>
let QUIZ = [];
let PASS_SCORE = 80;

function loadQuizData() {
  const params = new URLSearchParams(window.location.search);
  const file = params.get("quiz") || "questions.js";

  function applyData(data) {
    if (!data || !Array.isArray(data.questions) || data.questions.length === 0) {
      throw new Error("Plik nie zawiera poprawnych pytań: " + file);
    }
    QUIZ = data.questions;
    PASS_SCORE = data.passScore ?? 80;
    if (data.title) document.title = data.title;
    applyQuizImage(data.images);
  }

  // Wersja samodzielna: dane są już osadzone w pliku
  if (window.QUIZ_DATA) {
    try { applyData(window.QUIZ_DATA); return Promise.resolve(); }
    catch (e) { return Promise.reject(e); }
  }

  if (file.endsWith(".json")) {
    // JSON — wymaga http:// (nie działa z file://)
    return fetch(file)
      .then(r => { if (!r.ok) throw new Error("Nie można załadować: " + file); return r.json(); })
      .then(applyData);
  }

  // JS — wstrzyknięcie <script>, działa też z file://
  return new Promise((resolve, reject) => {
    const script = document.createElement("script");
    script.src = file;
    script.onload = () => {
      try { applyData(window.QUIZ_DATA); resolve(); }
      catch (e) { reject(e); }
    };
    script.onerror = () => reject(new Error("Nie można załadować pliku: " + file));
    document.head.appendChild(script);
  });
}
const SHAPES = ["▲", "◆", "●", "■"];
const LABELS = ["a", "b", "c", "d"];

let pendingAnswer = null; // wybrana ale jeszcze niezatwierdzona odpowiedź

let quizImages = [];
let lastImage  = null;

function applyQuizImage(images) {
  const wrap = document.querySelector(".quiz-image-wrap");
  if (Array.isArray(images) && images.length > 0) {
    quizImages = images;
    wrap.classList.remove("hidden");
  } else {
    quizImages = [];
    wrap.classList.add("hidden");
  }
}

function randomizeImage() {
  if (quizImages.length === 0) return;
  const pool = quizImages.length > 1 ? quizImages.filter(i => i !== lastImage) : quizImages;
  const picked = pool[Math.floor(Math.random() * pool.length)];
  lastImage = picked;
  document.querySelector(".quiz-image").src = picked;
}

function defaultState() {
  return {
    answers: {},
    shuffles: {},   // question id → shuffled original-index array
    currentIndex: 0,
    submitted: false,
    score: null,
    passed: null,
    timestamp: null
  };
}

// Returns array where shuffle[displayPos] = originalIndex
function getShuffledOptions(q) {
  if (!state.shuffles[q.id]) {
    const indices = q.options.map((_, i) => i);
    for (let i = indices.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [indices[i], indices[j]] = [indices[j], indices[i]];
    }
    state.shuffles[q.id] = indices;
  }
  return state.shuffles[q.id];
}

let state = defaultState();

function safeParseSuspendData(raw) {
  if (!raw || raw === "null" || raw === "undefined") return null;
  try {
    const parsed = JSON.parse(raw);
    if (parsed && typeof parsed === "object") return parsed;
  } catch (e) {
    console.warn("Cannot parse suspend_data:", e);
  }
  return null;
}

function loadStateFromSCORM() {
  const raw = SCORM.getValue("cmi.suspend_data");
  const saved = safeParseSuspendData(raw);

  if (saved) {
    state = { ...defaultState(), ...saved, answers: saved.answers || {} };

    if (!state.submitted) {
      // Find first unanswered question to resume from
      let firstUnanswered = QUIZ.length;
      for (let i = 0; i < QUIZ.length; i++) {
        if (state.answers[QUIZ[i].id] === undefined) {
          firstUnanswered = i;
          break;
        }
      }
      state.currentIndex = firstUnanswered;
    }

    showRestoreInfo("Przywrócono zapisany postęp.");
  }

  const lessonStatus = SCORM.getValue("cmi.core.lesson_status");
  if (!lessonStatus || lessonStatus === "not attempted") {
    SCORM.setValue("cmi.core.lesson_status", "incomplete");
    SCORM.save();
  }
}

function saveStateToSCORM() {
  state.timestamp = new Date().toISOString();
  SCORM.setValue("cmi.suspend_data", JSON.stringify(state));
  SCORM.setValue("cmi.core.lesson_location", String(state.currentIndex));
  SCORM.save();
}

function updateTopBar() {
  const total = QUIZ.length;
  const current = Math.min(state.currentIndex + 1, total);
  document.getElementById("questionCounter").textContent =
    "Pytanie " + current + "/" + total;
  document.getElementById("progressFill").style.width =
    Math.round((state.currentIndex / total) * 100) + "%";
}

function renderCurrentQuestion() {
  randomizeImage();
  const q = QUIZ[state.currentIndex];
  const alreadyAnswered = state.answers[q.id] !== undefined;

  document.getElementById("questionCard").textContent = q.question;
  updateTopBar();

  const grid = document.getElementById("answersGrid");
  grid.innerHTML = "";

  const shuffle = getShuffledOptions(q);   // shuffle[displayPos] = originalIndex

  shuffle.forEach((origIdx, displayPos) => {
    const btn = document.createElement("button");
    btn.className = "answer-btn " + LABELS[displayPos];

    const shape = document.createElement("span");
    shape.className = "shape";
    shape.textContent = SHAPES[displayPos];

    const text = document.createElement("span");
    text.textContent = q.options[origIdx];

    btn.appendChild(shape);
    btn.appendChild(text);

    if (alreadyAnswered) {
      btn.disabled = true;
      if (origIdx === q.correct) {
        btn.classList.add("reveal-correct");
      } else if (state.answers[q.id] === origIdx) {
        btn.classList.add("incorrect");
      }
    } else {
      btn.addEventListener("click", () => onAnswerClick(origIdx));
    }

    grid.appendChild(btn);
  });

  const bottomBar = document.getElementById("bottomBar");
  if (alreadyAnswered) {
    bottomBar.classList.remove("hidden");
    updateNextButton();
  } else {
    bottomBar.classList.add("hidden");
  }
}

function onAnswerClick(origIdx) {
  pendingAnswer = origIdx;

  const q = QUIZ[state.currentIndex];
  const shuffle = state.shuffles[q.id];
  document.querySelectorAll(".answer-btn").forEach((btn, displayPos) => {
    btn.classList.toggle("selected", shuffle[displayPos] === origIdx);
  });

  document.getElementById("bottomBar").classList.remove("hidden");
  updateNextButton();
}

function updateNextButton() {
  const isLast = state.currentIndex === QUIZ.length - 1;
  document.getElementById("nextBtn").textContent =
    isLast ? "Zobacz wynik →" : "Następne pytanie →";
}

function onNext() {
  if (pendingAnswer !== null) {
    // Zatwierdź odpowiedź i pokaż feedback
    const q = QUIZ[state.currentIndex];
    state.answers[q.id] = pendingAnswer;
    saveStateToSCORM();

    const selected = pendingAnswer;
    pendingAnswer = null;

    const shuffle = state.shuffles[q.id];
    document.querySelectorAll(".answer-btn").forEach((btn, displayPos) => {
      const origIdx = shuffle[displayPos];
      btn.disabled = true;
      btn.classList.remove("selected");
      if (origIdx === q.correct) {
        btn.classList.add(selected === origIdx ? "correct" : "reveal-correct");
      } else if (origIdx === selected) {
        btn.classList.add("incorrect");
      }
    });

    document.getElementById("bottomBar").classList.add("hidden");
    setTimeout(advance, 1200);
    return;
  }

  advance();
}

function advance() {
  state.currentIndex++;
  if (state.currentIndex >= QUIZ.length) {
    calculateResult();
  } else {
    renderCurrentQuestion();
  }
}

function calculateResult() {
  let correctCount = 0;
  QUIZ.forEach(q => {
    if (state.answers[q.id] === q.correct) correctCount++;
  });

  const score = Math.round((correctCount / QUIZ.length) * 100);
  const passed = score >= PASS_SCORE;

  state.submitted = true;
  state.score = score;
  state.passed = passed;

  SCORM.setValue("cmi.core.score.min", "0");
  SCORM.setValue("cmi.core.score.max", "100");
  SCORM.setValue("cmi.core.score.raw", String(score));
  SCORM.setValue("cmi.core.lesson_status", passed ? "passed" : "failed");
  saveStateToSCORM();

  showFinalResult();
}

function showFinalResult() {
  const correctCount = QUIZ.filter(q => state.answers[q.id] === q.correct).length;

  document.getElementById("questionWrap").classList.add("hidden");
  document.getElementById("answersGrid").classList.add("hidden");
  document.getElementById("bottomBar").classList.add("hidden");
  document.getElementById("questionCounter").textContent = "Quiz zakończony";
  document.getElementById("progressFill").style.width = "100%";

  const screen = document.getElementById("resultScreen");
  screen.classList.remove("hidden");

  if (state.score === 100) {
    showMarioSuccess(screen, correctCount);
  } else if (state.score <= 20) {
    showMarioFailure(screen, correctCount);
  } else {
    screen.innerHTML = `
      <div class="trophy">${state.passed ? "🏆" : "📚"}</div>
      <h2>${state.passed ? "Brawo!" : "Nie tym razem"}</h2>
      <div class="score-big">${state.score}%</div>
      <p>Poprawne odpowiedzi: ${correctCount} / ${QUIZ.length}</p>
      <span class="status-badge ${state.passed ? "passed" : "failed"}">
        ${state.passed ? "ZALICZONO" : "NIEZALICZONE"}
      </span>
    `;
  }
}

function showMarioSuccess(screen, correctCount) {
  screen.classList.add("mario-success");
  screen.innerHTML = `
    <div class="level-clear-text">✨ LEVEL CLEAR! ✨</div>
    <div class="mario-hero">🍄</div>
    <div class="score-big golden">100%</div>
    <p>Wszystkie odpowiedzi poprawne! ${correctCount}/${QUIZ.length}</p>
    <span class="status-badge passed" style="margin-top:20px">ZALICZONO</span>
  `;

  // Coins flying up continuously
  let coinWave = 0;
  const coinInterval = setInterval(() => {
    for (let i = 0; i < 4; i++) {
      const coin = document.createElement("div");
      coin.className = "coin-particle";
      coin.textContent = "🪙";
      coin.style.left = (4 + Math.random() * 92) + "%";
      coin.style.bottom = "-10px";
      coin.style.animationDuration = (0.8 + Math.random() * 0.65) + "s";
      coin.style.animationDelay = (Math.random() * 0.15) + "s";
      screen.appendChild(coin);
      setTimeout(() => coin.remove(), 1700);
    }
    if (++coinWave > 24) clearInterval(coinInterval);
  }, 160);

  // Fireworks bursting at random positions
  const fwColors = ["#FFD700", "#FF69B4", "#00FFFF", "#FF4500", "#7FFF00", "#FF1493", "#fff"];
  let fwWave = 0;
  const fwInterval = setInterval(() => {
    const cx = 10 + Math.random() * 80;
    const cy = 8  + Math.random() * 65;
    for (let i = 0; i < 14; i++) {
      const dot = document.createElement("div");
      dot.className = "firework-dot";
      dot.style.left = cx + "%";
      dot.style.top  = cy + "%";
      dot.style.background = fwColors[Math.floor(Math.random() * fwColors.length)];
      screen.appendChild(dot);
      const angle = (i / 14) * 2 * Math.PI;
      const dist  = 55 + Math.random() * 65;
      const dx = Math.cos(angle) * dist;
      const dy = Math.sin(angle) * dist;
      // double rAF so transition fires after element is in DOM
      requestAnimationFrame(() => requestAnimationFrame(() => {
        dot.style.transform = `translate(${dx}px, ${dy}px) scale(0)`;
        dot.style.opacity   = "0";
      }));
      setTimeout(() => dot.remove(), 850);
    }
    if (++fwWave > 14) clearInterval(fwInterval);
  }, 380);
}

function showMarioFailure(screen, correctCount) {
  screen.classList.add("mario-failure");
  screen.innerHTML = `
    <div class="mario-death-char">💀</div>
    <div class="game-over-text">GAME OVER</div>
    <div class="game-over-sub">
      <div class="score-big" style="color:#ff4444;margin-top:16px">${state.score}%</div>
      <p style="margin-top:10px">Poprawne odpowiedzi: ${correctCount} / ${QUIZ.length}</p>
      <span class="status-badge failed" style="margin-top:20px">NIEZALICZONE</span>
    </div>
  `;
}

function showRestoreInfo(message) {
  const el = document.getElementById("restoreInfo");
  el.textContent = message;
  el.classList.remove("hidden");
  setTimeout(() => el.classList.add("hidden"), 3000);
}

window.onload = async function () {
  SCORM.init();

  try {
    await loadQuizData();
  } catch (e) {
    document.body.innerHTML =
      `<div style="color:white;font-family:sans-serif;padding:40px;text-align:center">
         <h2>Błąd ładowania quizu</h2>
         <p>${e.message}</p>
         <p style="opacity:.6;font-size:14px">Sprawdź parametr <code>?quiz=</code> w adresie URL.</p>
       </div>`;
    return;
  }

  loadStateFromSCORM();

  if (state.submitted) {
    showFinalResult();
  } else if (state.currentIndex >= QUIZ.length) {
    calculateResult();
  } else {
    renderCurrentQuestion();
  }

  document.getElementById("nextBtn").addEventListener("click", onNext);
};

window.onbeforeunload = function () {
  saveStateToSCORM();
  SCORM.finish();
};

</script>
