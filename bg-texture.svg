<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <defs>

    <!-- Base radial gradient: lighter purple at top-left, deep at edges -->
    <radialGradient id="bg" cx="38%" cy="34%" r="78%">
      <stop offset="0%"   stop-color="#5a22aa"/>
      <stop offset="55%"  stop-color="#46178f"/>
      <stop offset="100%" stop-color="#240960"/>
    </radialGradient>

    <!-- Vignette: darkens corners -->
    <radialGradient id="vig" cx="50%" cy="50%" r="72%">
      <stop offset="25%" stop-color="transparent"/>
      <stop offset="100%" stop-color="#0b0025" stop-opacity="0.7"/>
    </radialGradient>

    <!-- Tileable rotated-square grid -->
    <pattern id="grid" width="58" height="58"
             patternUnits="userSpaceOnUse"
             patternTransform="rotate(45 400 400)">
      <rect width="58" height="58" fill="none"
            stroke="#9050e0" stroke-width="0.55"/>
    </pattern>

    <!-- Organic fractal noise -->
    <filter id="noise" x="0%" y="0%" width="100%" height="100%"
            color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.72 0.72"
                    numOctaves="4" seed="11" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="matrix"
        values="0 0 0 0 0.38
                0 0 0 0 0.13
                0 0 0 0 0.68
                0 0 0 0.18 0" result="cn"/>
      <feComposite in="cn" in2="SourceGraphic" operator="in"/>
    </filter>

  </defs>

  <!-- ① Base gradient -->
  <rect width="800" height="800" fill="url(#bg)"/>

  <!-- ② Large soft glows for depth -->
  <g opacity="0.07" fill="#cc88ff">
    <circle cx="160" cy="190" r="140"/>
    <circle cx="640" cy="140" r="170"/>
    <circle cx="720" cy="620" r="130"/>
    <circle cx="90"  cy="660" r="110"/>
    <circle cx="400" cy="420" r="200"/>
  </g>

  <!-- ③ Rotated grid -->
  <rect width="800" height="800" fill="url(#grid)" opacity="0.13"/>

